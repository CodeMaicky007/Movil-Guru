<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black pill -->
  <rect x="0" y="3" width="14" height="26" rx="7" fill="#0a0a0a"/>
  <!-- Lime pill -->
  <rect x="16" y="3" width="16" height="26" rx="7" fill="#CCFF00"/>
  <!-- M white -->
  <text x="7" y="16" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="11" font-weight="900" fill="white">M</text>
  <!-- G black -->
  <text x="24" y="16" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="11" font-weight="900" fill="#0a0a0a">G</text>
</svg>
